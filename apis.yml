  pointers_deliberately_withheld:
  - type: Authentication
    reason: >-
      The authentication/ artifact exists, but it records that Lightning Reach does NOT document its auth
      mechanism (no securitySchemes in the OpenAPI, no WWW-Authenticate challenge, no auth docs page).
      Emitting an Authentication pointer would falsely satisfy the authentication_documented check.
  - type: Idempotency
    reason: The API exposes no Idempotency-Key contract; conventions/ records idempotency as unsupported.
  - type: StatusPage
    reason: No status page exists (status.lightningreach.org does not resolve). The API root is a bare health check.
  - type: Deprecation
    reason: No deprecation or versioning policy is published.
  - type: Security
    reason: probe-security-programs.py found no security.txt, no disclosure page and no bug-bounty programme.
  - type: Compliance
    reason: No certifications or compliance programme are published; nothing verifiable to point at.
  - type: WellKnown
