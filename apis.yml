aid: lightning-social-ventures
name: Lightning Social Ventures
description: >-
  Lightning Social Ventures is the UK social-impact company behind Lightning Reach, a financial support
  platform that connects people facing hardship to grants, benefits, vouchers and assistance schemes
  through a single profile and eligibility match. Councils, housing associations, charities, utilities
  and banks use the platform to run and administer their own support programmes, from application intake
  through evidence review to award and payment. Lightning Reach operates a partner-facing REST API that
  exposes support schemes, application submission and referral, applicant evidence assets, decision and
  award recording, and webhook subscriptions with public-key signature verification.
